name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.1"
          args: check training
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.1"
          args: format --check training
